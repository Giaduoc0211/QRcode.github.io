<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phát audio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: url("canhchim.jpg") no-repeat center center / cover;
      position: relative;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    #playBtn {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      padding: 14px 24px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;

      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: 0.2s;
    }

    #playBtn:hover {
      transform: translateX(-50%) scale(1.05);
      background: rgba(0, 0, 0, 0.82);
    }

    .lyrics-wrap {
      position: absolute;
      left: 50%;
      top: 28%;
      transform: translateX(-50%);
      width: min(90vw, 900px);
      z-index: 10;
      pointer-events: none;
    }

    .lyrics {
      position: relative;
      min-height: 170px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .lyric-line {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(42px);
      width: 100%;

      font-size: clamp(24px, 3vw, 42px);
      font-weight: 900;
      line-height: 1.5;
      letter-spacing: 0.2px;

      color: rgba(255, 255, 255, 0.58);
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.55),
        0 0 20px rgba(255, 255, 255, 0.30),
        0 2px 10px rgba(0, 0, 0, 0.75),
        0 4px 20px rgba(0, 0, 0, 0.55);

      opacity: 0;
      transition:
        opacity 0.5s ease,
        transform 1.2s ease,
        color 0.35s ease,
        text-shadow 0.35s ease;
    }

    .lyric-line.show {
      opacity: 0.72;
      transform: translateX(-50%) translateY(0);
    }

    .lyric-line.active {
      opacity: 1;
      color: #fff8c9;
      text-shadow:
        0 0 10px rgba(255, 248, 201, 0.95),
        0 0 22px rgba(255, 232, 140, 0.75),
        0 0 36px rgba(255, 218, 90, 0.45),
        0 2px 10px rgba(0, 0, 0, 0.85),
        0 4px 22px rgba(0, 0, 0, 0.60);
    }

    .lyric-line.old {
      opacity: 0;
      transform: translateX(-50%) translateY(-46px);
    }

    .word {
      opacity: 0.42;
      transition:
        opacity 0.15s linear,
        color 0.15s linear,
        text-shadow 0.15s linear;
    }

    .word.read {
      opacity: 1;
      color: #ffffff;
      text-shadow:
        0 0 8px rgba(255,255,255,0.9),
        0 0 16px rgba(255,235,150,0.8);
    }

    audio {
      display: none;
    }

    @media (max-width: 768px) {
      #playBtn {
        top: 8%;
        font-size: 16px;
        padding: 12px 20px;
      }

      .lyrics-wrap {
        top: 23%;
        width: 92vw;
      }

      .lyrics {
        min-height: 130px;
        padding: 14px;
      }

      .lyric-line {
        font-size: clamp(20px, 5vw, 30px);
        line-height: 1.45;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="playBtn">Bấm để phát</button>

    <div class="lyrics-wrap">
      <div class="lyrics" id="lyrics"></div>
    </div>

    <audio id="audio">
      <source src="audio.m4a" type="audio/mp4" />
      Trình duyệt của bạn không hỗ trợ audio.
    </audio>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const lyricsEl = document.getElementById("lyrics");

    const subtitles = [
      { start: 0.0, end: 9.0, text: "Trong mỗi nhịp đập, cánh chim chiến giữa bầu trời Tổ quốc, có một cánh chim mang theo khát khao kiên cường, đó là Nguyễn Văn Bảy." },
      { start: 9.0, end: 14.0, text: "Ông không phải sinh ra để bay, nhưng đã trở thành một huyền thoại trên bầu trời." },
      { start: 14.0, end: 25.0, text: "Không phải bởi những lời ca ngợi, cuộc đời ông là bản anh hùng ca, với mồ hôi, nước mắt và những cánh bay không mỏi của ngày trở về." },
      { start: 25.0, end: 30.0, text: "Cuốn sách Cánh Chim Bất Tử là chương hồi đầy cảm xúc." },
      { start: 30.0, end: 36.0, text: "Kể về người nông dân mang tâm hồn chất phác miền Tây, bằng lòng can trường và tình yêu nước." },
      { start: 36.0, end: 39.0, text: "Đã làm nên những chiến công khiến thế giới phải khâm phục." },
      { start: 39.0, end: 44.0, text: "Qua từng trang viết, người đọc không chỉ thấy một phi công MiG-17." },
      { start: 44.0, end: 52.0, text: "Mà còn thấy một người cha, người đồng đội bình dị, sống khiêm nhường, yêu thương và cống hiến." },
      { start: 52.0, end: 58.0, text: "Đây không chỉ là câu chuyện về một con người, mà là câu chuyện về tinh thần Việt Nam." },
      { start: 58.0, end: 64.0, text: "Tinh thần kiên cường, giản dị, bất khuất." },
      { start: 64.0, end: 69.0, text: "Cánh Chim Bất Tử không cần tô vẽ." },
      { start: 69.0, end: 75.0, text: "Bởi chính sự thật của cuộc đời ấy đã làm nên một huyền thoại." },
      { start: 75.0, end: 80.0, text: "Đọc để cảm, để thương, để biết rằng có những con người đã bay lên vì đất nước." },
      { start: 80.0, end: 86.0, text: "Và dù đã nằm lại, họ vẫn không bao giờ rời khỏi trái tim nhân dân." },
      { start: 86.0, end: 90.0, text: "Một cuốn sách khiến ta phải suy ngẫm, và trân trọng." }
    ];

    let lineNodes = [];
    let currentIndex = -1;

    function createLyrics() {
      lyricsEl.innerHTML = "";

      lineNodes = subtitles.map((item, index) => {
        const line = document.createElement("div");
        line.className = "lyric-line";
        line.dataset.index = index;

        const words = item.text.split(" ");
        words.forEach((word, i) => {
          const span = document.createElement("span");
          span.className = "word";
          span.textContent = word + (i < words.length - 1 ? " " : "");
          line.appendChild(span);
        });

        lyricsEl.appendChild(line);
        return line;
      });
    }

    function resetWords() {
      lineNodes.forEach(line => {
        line.querySelectorAll(".word").forEach(word => {
          word.classList.remove("read");
        });
      });
    }

    function highlightWords(index, currentTime) {
      resetWords();

      const item = subtitles[index];
      const line = lineNodes[index];
      if (!item || !line) return;

      const words = line.querySelectorAll(".word");
      const duration = item.end - item.start;
      const progress = Math.max(0, Math.min(1, (currentTime - item.start) / duration));
      const wordsToHighlight = Math.floor(progress * words.length);

      words.forEach((word, i) => {
        if (i <= wordsToHighlight - 1) {
          word.classList.add("read");
        }
      });
    }

    function updateLyrics(currentTime) {
      const activeIndex = subtitles.findIndex(
        line => currentTime >= line.start && currentTime <= line.end
      );

      if (activeIndex !== currentIndex) {
        currentIndex = activeIndex;
      }

      lineNodes.forEach((node, index) => {
        node.classList.remove("show", "active", "old");

        if (index === activeIndex) {
          node.classList.add("show", "active");
        } else if (index === activeIndex - 1) {
          node.classList.add("old");
        } else if (index === activeIndex + 1) {
          node.classList.add("show");
        }
      });

      if (activeIndex >= 0) {
        highlightWords(activeIndex, currentTime);
      } else {
        resetWords();
      }
    }

    playBtn.addEventListener("click", async () => {
      try {
        if (audio.paused) {
          await audio.play();
          playBtn.textContent = "Đang phát";
        } else {
          audio.pause();
          playBtn.textContent = "Bấm để phát";
        }
      } catch (err) {
        playBtn.textContent = "Không phát được";
      }
    });

    audio.addEventListener("timeupdate", () => {
      updateLyrics(audio.currentTime);
    });

    audio.addEventListener("ended", () => {
      playBtn.textContent = "Bấm để phát";
      currentIndex = -1;
      resetWords();
      lineNodes.forEach(node => {
        node.classList.remove("show", "active", "old");
      });
    });

    createLyrics();
  </script>
</body>
</html>
