<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phát audio</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: url("canhchim.jpg") no-repeat center / cover;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100dvh;
    }

    #playBtn {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      padding: 14px 24px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;

      background: rgba(0,0,0,0.75);
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .lyrics-wrap {
      position: absolute;
      left: 50%;
      top: 20%;
      transform: translateX(-50%);
      width: min(95vw, 1000px);
    }

    /* 🔥 FIX CHÍNH Ở ĐÂY */
    .lyrics {
      position: relative;
      width: 100%;
      height: 260px;            /* tăng mạnh */
      padding: 30px 20px;       /* thêm khoảng thở */
      overflow: hidden;
      text-align: center;
    }

    .lyric-line {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, 20px);
      width: 100%;

      font-size: clamp(22px, 2.8vw, 40px);
      font-weight: 900;
      line-height: 1.5;
      color: #fff;

      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0 0 10px rgba(255,255,255,1);

      opacity: 0;
      transition: all 0.4s ease;
    }

    .lyric-line.show {
      opacity: 1;
      transform: translate(-50%, -55%);
    }

    .lyric-line.active {
      color: #fff4a8;
    }

    .lyric-line.old {
      opacity: 0;
      transform: translate(-50%, -140px); /* bay xa hơn */
    }

    .word {
      opacity: 0.6;
    }

    .word.read {
      opacity: 1;
      color: #fff;
      text-shadow: 0 0 12px #fff;
    }

    audio { display: none; }

    @media (max-width: 768px) {
      .lyrics {
        height: 240px;
        padding: 25px 10px;
      }

      .lyric-line {
        font-size: clamp(18px, 5vw, 28px);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <button id="playBtn">Bấm để phát</button>

    <div class="lyrics-wrap">
      <div class="lyrics" id="lyrics"></div>
    </div>

    <audio id="audio">
      <source src="audio.m4a" type="audio/mp4" />
    </audio>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const lyricsEl = document.getElementById("lyrics");

     const subtitles = [
      { start: 0.0, end: 9.0, text: "Trong muôn vạn cánh chim của bầu trời Tổ quốc, có một cánh chim mang theo cả hào khí non sông, đó là Nguyễn Văn Bảy." },
      { start: 9.0, end: 14.0, text: "Ông không phải là người sinh ra để bay, nhưng đã trở thành một huyền thoại trên bầu trời." },
      { start: 14.0, end: 25.0, text: "Không phải bởi những lời ca ngợi, cuộc đời ông là bản anh hùng ca, với mồ hôi, nước mắt và những cánh bay không mỏi của ngày trở về." },
      { start: 25.0, end: 30.0, text: "Cuốn sách Cánh Chim Bất Tử là hành trình trở lại với những năm tháng đầy khói lửa." },
      { start: 30.0, end: 36.0, text: "nơi người nông dân mang tâm hồn chất phác miền Tây, bằng lòng can trường và trái tim yêu nước." },
      { start: 36.0, end: 39.0, text: "Đã làm nên những chiến công khiến cả thế giới phải ngưỡng mộ." },
      { start: 39.0, end: 44.0, text: "Qua từng trang viết, người đọc không chỉ thấy một phi công bắn rơi máy bay mỹ." },
      { start: 44.0, end: 52.0, text: "Mà còn thấy một người chồng người cha, người đồng đội luôn chọn sống khiêm nhường, yêu thương và cống hiến." },
      { start: 52.0, end: 58.0, text: "Đây không chỉ là câu chuyện về một con người, mà là câu chuyện về tinh thần Việt Nam." },
      { start: 58.0, end: 64.0, text: "Kiên cường, giản dị, bất khuất." },
      { start: 64.0, end: 69.0, text: "Cánh Chim Bất Tử không cần tô vẽ." },
      { start: 69.0, end: 75.0, text: "Bởi chính cuộc đời thật của Nguyễn Văn Bảy đã là một huyền thoại." },
      { start: 75.0, end: 80.0, text: "Đọc để cảm, để thương, để biết rằng có những con người đã bay lên vì đất nước." },
      { start: 80.0, end: 86.0, text: "Và dù đã nằm lại, họ vẫn không bao giờ rời khỏi trái tim nhân dân." },
      { start: 86.0, end: 90.0, text: "Một cuốn sách viết ra từ trái tim để chạm tới trái tim." }
    ];

    let lineNodes = [];

    function createLyrics() {
      lyricsEl.innerHTML = "";

      lineNodes = subtitles.map(item => {
        const line = document.createElement("div");
        line.className = "lyric-line";

        const words = item.text.split(" ");
        words.forEach(w => {
          const span = document.createElement("span");
          span.className = "word";
          span.textContent = w + " ";
          line.appendChild(span);
        });

        lyricsEl.appendChild(line);
        return line;
      });
    }

    function updateLyrics(t) {
      const idx = subtitles.findIndex(
        s => t >= s.start && t <= s.end
      );

      lineNodes.forEach((node, i) => {
        node.className = "lyric-line";

        if (i === idx) {
          node.classList.add("show", "active");
        } else if (i < idx) {
          node.classList.add("old");
        }
      });

      if (idx >= 0) {
        const item = subtitles[idx];
        const words = lineNodes[idx].querySelectorAll(".word");

        const progress = (t - item.start) / (item.end - item.start);
        const count = Math.floor(progress * words.length);

        words.forEach((w, i) => {
          w.classList.toggle("read", i < count);
        });
      }
    }

    playBtn.onclick = async () => {
      if (audio.paused) {
        await audio.play();
        playBtn.textContent = "Đang phát";
      } else {
        audio.pause();
        playBtn.textContent = "Bấm để phát";
      }
    };

    audio.ontimeupdate = () => updateLyrics(audio.currentTime);

    createLyrics();
  </script>
</body>
</html>
