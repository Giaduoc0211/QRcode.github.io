<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phát audio</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      overflow: hidden;

      background: url("canhchim.jpg") no-repeat center/cover;
    }

    /* container full màn hình */
    .container {
      position: relative;
      width: 100%;
      height: 100dvh;
    }

    /* nút */
    button {
      position: absolute;

      /* 🔥 chỉnh vị trí tại đây */
      top: 18%;          /* kéo lên cao */
      left: 50%;
      transform: translateX(-50%);

      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;

      background: rgba(0, 0, 0, 0.6);
      color: #fff;

      backdrop-filter: blur(6px);
      transition: 0.2s;
    }

    button:hover {
      transform: translateX(-50%) scale(1.05);
      background: rgba(0,0,0,0.8);
    }

    audio {
      display: none;
    }

    /* 📱 mobile chỉnh lại chút */
    @media (max-width: 768px) {
      button {
        top: 12%;   /* mobile kéo cao hơn nữa */
        font-size: 16px;
        padding: 12px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <button id="playBtn">Bấm để phát</button>

    <audio id="audio">
      <source src="audio.aac" type="audio/aac" />
    </audio>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', async () => {
      if (audio.paused) {
        await audio.play();
        playBtn.textContent = "Đang phát";
      } else {
        audio.pause();
        playBtn.textContent = "Bấm để phát";
      }
    });
  </script>
</body>
</html>
